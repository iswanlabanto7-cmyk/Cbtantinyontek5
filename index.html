    <script>
      // Prevent Vite HMR WebSocket closed errors in cloud/iframe environments
      window.addEventListener('unhandledrejection', function (event) {
        if (event.reason && (
          event.reason.message?.includes('WebSocket') ||
          String(event.reason).includes('WebSocket') ||
          String(event.reason).includes('closed without opened')
        )) {
          event.preventDefault();
          event.stopPropagation();
        }
      });
      window.addEventListener('error', function (event) {
        if (event.message && (event.message.includes('WebSocket') || event.message.includes('closed without opened'))) {
          event.preventDefault();
          event.stopPropagation();
        }
      });
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
